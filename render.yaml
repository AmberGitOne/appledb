# Render blueprint.
#
# In the Render dashboard: New -> Blueprint -> point it at this repo.
# Render reads this file and provisions the web service and its database.
#
# There is no disk here any more. The app talks to PostgreSQL over the
# network, so the filesystem is disposable and Render can replace the
# instance freely without touching the data.

databases:
  - name: aglc-crm-db
    databaseName: crm
    user: crm
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: apple-globalcare-crm
    runtime: node
    plan: starter
    region: oregon
    branch: main

    buildCommand: npm ci --omit=dev --ignore-scripts

    # bootstrap.js applies the schema, and seeds ONLY when the database has
    # no users. Migrating alone would leave the first deploy with zero users,
    # which with REQUIRE_AUTH=true means nobody can sign in. It is also safe
    # on every later deploy: it leaves existing data alone.
    startCommand: node server/db/bootstrap.js && node server/index.js

    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aglc-crm-db
          property: connectionString

      - key: NODE_ENV
        value: production

      - key: REQUIRE_AUTH
        value: "true"      # the app is reachable from the internet here

      # The sign-in page offers a one-click account picker, which means
      # publishing the seeded accounts' shared password. Never on a public
      # URL. NODE_ENV=production already turns it off; this says so outright.
      - key: DEMO_LOGIN
        value: "false"

      # The seeded accounts share one password, and the repository's default
      # is public, so the boot step refuses to use it under NODE_ENV=production.
      # Render generates one instead - read it in the dashboard under
      # Environment when you need to sign in.
      - key: DEMO_PASSWORD
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: TOKEN_TTL
        value: 12h
